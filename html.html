<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANKY GADGET - Clothes, Shoes, Bags & Gadgets</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#111;color:#fff;padding:20px;text-align:center;position:sticky;top:0;z-index:100}
header h1{font-size:30px;letter-spacing:2px}
header h1 span{color:#00ff88}
header p{color:#ccc;margin-top:6px}
.filter{text-align:center;padding:15px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.1);position:sticky;top:78px;z-index:99}
.filter button{padding:10px 18px;margin:4px;border:1px solid #111;background:#fff;border-radius:20px;font-weight:bold;cursor:pointer}
.filter button.active,.filter button:hover{background:#111;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;padding:20px;max-width:1200px;margin:auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card img{width:100%;height:300px;object-fit:cover}
.card-body{padding:14px}
.card-body h3{font-size:17px}
.price{color:#e60000;font-weight:bold;font-size:20px;margin:8px 0}
.btn{display:block;background:#25D366;color:#fff;text-align:center;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold}
.btn:hover{background:#128C7E}
footer{background:#111;color:#fff;text-align:center;padding:20px;margin-top:20px}
footer span{color:#00ff88}
</style>
</head>
<body>

<header>
<h1>BANKY <span>GADGET</span></h1>
<p>Clothes | Shoes | Bags | Gadgets | WhatsApp: 08124513670 - Aba</p>
</header>

<div class="filter">
<button class="active" onclick="filterCat('all',this)">ALL</button>
<button onclick="filterCat('clothes',this)">CLOTHES</button>
<button onclick="filterCat('shoes',this)">SHOES</button>
<button onclick="filterCat('bags',this)">BAGS</button>
<button onclick="filterCat('gadgets',this)">GADGETS</button>
</div>

<div class="products" id="productList"></div>

<footer>© 2026 <span>BANKY GADGET</span> - WhatsApp 08124513670 | Aba, Abia State</footer>

<script>
// EDIT YOUR PRODUCTS HERE ONLY
const products = [
{
name: "Female Designer Bag",
price: "15,000",
image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600",
category: "bags"
},
{
name: "Men Sneakers - White",
price: "25,000",
image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600",
category: "shoes"
},
{
name: "Ladies Gown - Red",
price: "12,000",
image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600",
category: "clothes"
},
{
name: "Smart Watch",
price: "18,500",
image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",
category: "gadgets"
},
{
name: "Men Native Wear",
price: "18,000",
image: "https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600",
category: "clothes"
},
{
name: "Wireless Earbuds",
price: "9,000",
image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600",
category: "gadgets"
}
];

const box = document.getElementById('productList');
const waNumber = "2348124513670";
function showProducts(items){
box.innerHTML="";
items.forEach(p=>{
let msg = encodeURIComponent("Hello BANKY GADGET, I want to order:\n*"+p.name+"*\nPrice: ₦"+p.price+"\n\nIs it available?");
box.innerHTML+=<div class="card"><img src="${p.image}"><div class="card-body"><h3>${p.name}</h3><div class="price">₦${p.price}</div><a class="btn" href="https://wa.me/${waNumber}?text=${msg}" target="_blank">ORDER ON WHATSAPP</a></div></div>;
});
}
function filterCat(cat,btn){
document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(cat=='all'){showProducts(products)}else{showProducts(products.filter(x=>x.category==cat))}
}
showProducts(products);
</script>
</body>
</html>
